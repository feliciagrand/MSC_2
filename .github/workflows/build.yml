name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project CalibrationApp.xcodeproj \
            -scheme CalibrationApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/CalibrationApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package into IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/CalibrationApp.xcarchive/Products/Applications/CalibrationApp.app \
                $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r CalibrationApp.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalibrationApp-ipa
          path: ${{ runner.temp }}/CalibrationApp.ipa
          retention-days: 30
